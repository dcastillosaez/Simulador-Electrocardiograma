[project]
name = "ecg-api"
version = "0.1.0"
description = "API y streaming del simulador de ECG"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    # El motor del escritorio. Va en las dependencias base y no en un extra
    # porque el mismo binario empaquetado tiene que poder hablar los dos, y
    # porque pesa unos pocos kilobytes: hacerlo opcional solo añadiría una
    # forma de que el instalador saliera sin él.
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "numpy>=2.0",
    "ecg-engine",
    "pharmacology-engine",
    "heart-engine",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27", "psycopg2-binary>=2.9"]

[tool.uv.sources]
ecg-engine = { path = "../../packages/ecg-engine", editable = true }
pharmacology-engine = { path = "../../packages/pharmacology-engine", editable = true }
heart-engine = { path = "../../packages/heart-engine", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecg_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
