# Estas 17 alertas de OSV-Scanner (via el check "Vulnerabilities" de
# Scorecard) son avisos "unmaintained" de RustSec: el propio texto de cada
# uno dice que no hay version corregida, porque el repositorio de origen esta
# archivado. No se resuelven con un `cargo update` -- no hay a que subir -- y
# no vienen de una dependencia que este proyecto elija: las trae Tauri.
#
# De donde salen, dos grupos:
#
# 1. El backend de WebView de Tauri en Linux (`wry`/`tao`) usa las bindings
#    GTK3 de gtk-rs (atk, gdk, gtk, glib-macros y el resto de esta lista).
#    Ese repositorio lo archivaron sus mantenedores en 2024 remitiendo a
#    gtk4-rs como sucesor. Ninguna de estas crates llega a compilarse en lo
#    que este proyecto distribuye: `release.yml` construye el instalador
#    solo en `windows-latest`, y ahi el backend de WebView es WebView2, no
#    GTK. Estan en Cargo.lock porque el lockfile resuelve el grafo de
#    dependencias de Tauri para todas las plataformas que soporta, no solo
#    la que se compila aqui.
# 2. `urlpattern`, dependencia directa de Tauri (esta si, multiplataforma),
#    usa las crates Unicode `unic-*`, del repositorio archivado
#    open-i18n/rust-unic.
#
# El dia que Tauri migre su backend de Linux a gtk4-rs, o que `urlpattern`
# deje de depender de `unic-*`, un `cargo update` limpia estas entradas de
# Cargo.lock y estas lineas se pueden borrar sin mas.

