[package]
name = "simulador-ecg"
version = "0.1.0"
description = "Simulador de ECG — puesto de simulación clínica"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# El binario de release se optimiza para tamaño: la mayor parte de lo que se
# distribuye es Python y el frontend, y unos megas de más en el shell no
# compran nada.
[profile.release]
opt-level = "s"
lto = true
strip = true
