[package]
name = "simulador-ecg"
version = "0.1.0"
description = "Simulador de ECG — puesto de simulación clínica"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

# Job objects de Windows: lo que garantiza que los hijos mueran con el padre
# aunque el padre muera de forma anormal (ver `backend.rs`).
[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
]

# El binario de release se optimiza para tamaño: la mayor parte de lo que se
# distribuye es Python y el frontend, y unos megas de más en el shell no
# compran nada.
[profile.release]
opt-level = "s"
lto = true
strip = true
