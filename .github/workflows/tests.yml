name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (${{ matrix.motor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Los dos motores, siempre. El servidor persiste en Postgres y el
      # escritorio en SQLite: un soporte que no se ejercita se rompe en el
      # primer commit que toque el esquema, y nadie se entera hasta que lo
      # reporta un usuario. Es la condición de la decisión de la fase G3.
      matrix:
        motor: [postgres, sqlite]

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecg
          POSTGRES_PASSWORD: ecg
          POSTGRES_DB: ecg_simulator
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ecg"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Sincronizar dependencias
        working-directory: apps/api
        run: uv sync --extra dev
      - name: Tests
        working-directory: apps/api
        env:
          ECG_TEST_DB: ${{ matrix.motor }}
        run: uv run pytest -q

  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Instalar dependencias
        working-directory: apps/web
        run: npm ci
      - name: Comprobación de tipos
        working-directory: apps/web
        run: npx tsc -b --noEmit
      - name: Tests
        working-directory: apps/web
        run: npm test

  escritorio:
    name: Escritorio (Tauri)
    # Windows y no Ubuntu porque es la única plataforma en la que este crate
    # existe: `job.rs` usa job objects de Windows y el bundle es un NSIS. Un
    # test verde en Linux no diría nada del programa que se distribuye.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @ 2026-08-05
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
      # Aquí viven los tests del arranque del backend, de la licencia firmada y
      # del contador de arranques fallidos, que hasta ahora solo se ejecutaban
      # en la máquina de quien se acordara. Y el que vigila que el escritorio
      # siga sin hacer conexiones salientes, que es una promesa escrita en
      # `docs/instalacion.md` y por tanto ya distribuida.
      # `tauri.conf.json` declara el backend empaquetado como recurso del
      # bundle, y el build script se niega a compilar si esa carpeta no existe.
      # Es deliberado y hay que conservarlo: sin esa negativa, un `tauri build`
      # sin haber pasado antes PyInstaller produce un instalador sin backend
      # dentro **y sin fallar**, que es la peor de las dos formas de romperse.
      #
      # Aquí no se bundlea nada —solo se compila y se corren los tests— así que
      # basta con que la ruta exista. Empaquetar el backend de verdad son tres
      # minutos de PyInstaller en cada pull request para no comprobar nada que
      # `release.yml` no compruebe ya, ahí sí sobre el artefacto real.
      - name: Marcador del recurso del backend
        shell: pwsh
        run: New-Item -ItemType Directory -Force apps/api/packaging/dist/ecg-api | Out-Null

      - name: Tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --quiet

  dependencias:
    name: Vulnerabilidades conocidas
    runs-on: ubuntu-latest
    # Avisa, no bloquea. En un proyecto pequeño, que una vulnerabilidad
    # moderada en una dependencia de desarrollo impida mergear un cambio de
    # interfaz un viernes hace que se acabe ignorando el aviso entero.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: npm audit
        working-directory: apps/web
        # El `|| true` es lo que hace real el "avisa, no bloquea" de arriba:
        # `continue-on-error` salva al workflow, pero el paso seguía marcando
        # el check en rojo en el pull request y, con el shell en `-e`, cortaba
        # el job antes de llegar a `pip-audit`. Un aviso que impide ver el
        # siguiente aviso no informa de nada. El informe sigue completo en el
        # log del job, que es donde se lee.
        run: npm audit --package-lock-only --audit-level=high || true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: pip-audit
        working-directory: apps/api
        run: uvx pip-audit --strict --progress-spinner off || true
