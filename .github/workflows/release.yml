name: Release

# Un tag produce un instalador firmado, probado y publicado. Sin pasos
# manuales: lo que se hace a mano se hace distinto cada vez, y en un instalador
# eso significa distribuir algo que nadie ha ejecutado.
on:
  push:
    tags: ["v*"]
  # Para ensayar la pipeline sin publicar nada.
  workflow_dispatch:

# Minimo por defecto y ampliado solo donde hace falta: de los dos jobs, el
# unico que escribe algo es `build`, y solo en su ultimo paso (crear la
# release y subirle el instalador). `tests` no necesita mas que leer el
# codigo.
permissions:
  contents: read

jobs:
  # Los tests, antes que nada. Si no pasan, no hay release: un instalador
  # firmado de código roto es peor que no tener instalador.
  tests:
    name: Tests (${{ matrix.motor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        motor: [postgres, sqlite]
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecg
          POSTGRES_PASSWORD: ecg
          POSTGRES_DB: ecg_simulator
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ecg"
          --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - working-directory: apps/api
        run: uv sync --extra dev
      - working-directory: apps/api
        env:
          ECG_TEST_DB: ${{ matrix.motor }}
        run: uv run pytest -q

  build:
    name: Instalador de Windows
    needs: tests
    runs-on: windows-latest
    # El unico permiso de escritura de todo el workflow: lo usa
    # `softprops/action-gh-release` al final para crear el borrador de
    # release y subirle el instalador.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      # `dtolnay/rust-toolchain` no publica tags de version: su propio uso
      # previsto es referenciar la rama `stable`/`nightly`/`beta`, que el
      # repositorio mantiene siempre al dia. Pinado igualmente al commit de
      # cabeza de esa rama en el momento de este cambio, con la fecha en el
      # comentario -- si se queda atras, Dependabot lo detecta igual que
      # cualquier otra accion (ver seccion de dependencias en el PR).
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @ 2026-08-05

      - name: Frontend
        working-directory: apps/web
        run: |
          npm ci
          npm test
          npm run build

      # El backend se empaqueta ANTES del bundle: `tauri.conf.json` lo incluye
      # como recurso desde `packaging/dist`, así que si no está, el instalador
      # sale sin él — y sin fallar, que es lo peligroso.
      - name: Empaquetar el backend
        working-directory: apps/api
        run: |
          uv sync --extra dev
          uv run --with pyinstaller pyinstaller packaging/ecg-api.spec `
            --distpath packaging/dist --workpath packaging/build --noconfirm

      - name: Comprobar que el backend se empaquetó
        working-directory: apps/api
        shell: pwsh
        run: |
          if (-not (Test-Path "packaging/dist/ecg-api/ecg-api.exe")) {
            throw "el backend no se empaquetó: el instalador saldría vacío"
          }

      - name: Instalador
        working-directory: apps/desktop
        env:
          # La huella del certificado, no el certificado. La clave privada vive
          # en el almacén del runner o en el HSM que lo respalde, y aquí solo
          # viaja un identificador que no es secreto.
          ECG_SIGN_THUMBPRINT: ${{ secrets.ECG_SIGN_THUMBPRINT }}
        run: |
          npm ci
          npx tauri build

      # Un instalador que no se ha ejecutado nunca no es un release. Esto lo
      # instala en el runner, lo arranca, comprueba que levanta el backend y lo
      # desinstala.
      - name: Smoke test del instalador
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File apps/desktop/tools/probar_instalador.ps1

      - name: Comprobar la firma
        shell: pwsh
        run: |
          $inst = Get-Item "apps/desktop/src-tauri/target/release/bundle/nsis/*setup.exe"
          $firma = Get-AuthenticodeSignature $inst.FullName
          "estado: $($firma.Status)"
          if ($env:ECG_SIGN_THUMBPRINT -and $firma.Status -ne "Valid") {
            throw "hay certificado configurado pero el instalador no quedó firmado"
          }
        env:
          ECG_SIGN_THUMBPRINT: ${{ secrets.ECG_SIGN_THUMBPRINT }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instalador-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*setup.exe

      - name: Publicar la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: apps/desktop/src-tauri/target/release/bundle/nsis/*setup.exe
          draft: true
          body: |
            Simulador de ECG — ${{ github.ref_name }}

            Herramienta docente. No está destinada al diagnóstico ni al
            tratamiento de pacientes.
