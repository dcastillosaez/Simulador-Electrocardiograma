name: Release

# Un tag produce un instalador firmado, probado y publicado. Sin pasos
# manuales: lo que se hace a mano se hace distinto cada vez, y en un instalador
# eso significa distribuir algo que nadie ha ejecutado.
on:
  push:
    tags: ["v*"]
  # Para ensayar la pipeline sin publicar nada.
  workflow_dispatch:

# Minimo por defecto y ampliado solo donde hace falta: de los dos jobs, el
# unico que escribe algo es `build`, y solo en su ultimo paso (crear la
# release y subirle el instalador). `tests` no necesita mas que leer el
# codigo.
permissions:
  contents: read

jobs:
  # Los tests, antes que nada. Si no pasan, no hay release: un instalador
  # firmado de código roto es peor que no tener instalador.
  tests:
    name: Tests (${{ matrix.motor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        motor: [postgres, sqlite]
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecg
          POSTGRES_PASSWORD: ecg
          POSTGRES_DB: ecg_simulator
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ecg"
          --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - working-directory: apps/api
        run: uv sync --extra dev
      - working-directory: apps/api
        env:
          ECG_TEST_DB: ${{ matrix.motor }}
        run: uv run pytest -q

  build:
    name: Instalador de Windows
    needs: tests
    runs-on: windows-latest
    # El unico permiso de escritura de todo el workflow: lo usa
    # `softprops/action-gh-release` al final para crear el borrador de
    # release y subirle el instalador.
    permissions:
      contents: write
      # La attestation de procedencia se firma con un token OIDC efimero de
      # este workflow y se registra en el log publico de transparencia: no hay
      # clave que guardar, y quien descargue el instalador puede comprobar que
      # salio de este repositorio y de este commit.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # `dtolnay/rust-toolchain` no publica tags de version: su propio uso
      # previsto es referenciar la rama `stable`/`nightly`/`beta`, que el
      # repositorio mantiene siempre al dia. Pinado igualmente al commit de
      # cabeza de esa rama en el momento de este cambio, con la fecha en el
      # comentario -- si se queda atras, Dependabot lo detecta igual que
      # cualquier otra accion (ver seccion de dependencias en el PR).
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @ 2026-08-05

      - name: Frontend
        working-directory: apps/web
        run: |
          npm ci
          npm test
          npm run build

      # El backend se empaqueta ANTES del bundle: `tauri.conf.json` lo incluye
      # como recurso desde `packaging/dist`, así que si no está, el instalador
      # sale sin él — y sin fallar, que es lo peligroso.
      - name: Empaquetar el backend
        working-directory: apps/api
        run: |
          uv sync --extra dev
          uv run --with pyinstaller pyinstaller packaging/ecg-api.spec `
            --distpath packaging/dist --workpath packaging/build --noconfirm

      - name: Comprobar que el backend se empaquetó
        working-directory: apps/api
        shell: pwsh
        run: |
          if (-not (Test-Path "packaging/dist/ecg-api/ecg-api.exe")) {
            throw "el backend no se empaquetó: el instalador saldría vacío"
          }

      - name: Instalador
        working-directory: apps/desktop
        env:
          # La huella del certificado, no el certificado. La clave privada vive
          # en el almacén del runner o en el HSM que lo respalde, y aquí solo
          # viaja un identificador que no es secreto.
          ECG_SIGN_THUMBPRINT: ${{ secrets.ECG_SIGN_THUMBPRINT }}
        run: |
          npm ci
          npx tauri build

      # Un instalador que no se ha ejecutado nunca no es un release. Esto lo
      # instala en el runner, lo arranca, comprueba que levanta el backend y lo
      # desinstala.
      - name: Smoke test del instalador
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File apps/desktop/tools/probar_instalador.ps1

      - name: Comprobar la firma
        shell: pwsh
        run: |
          $inst = Get-Item "apps/desktop/src-tauri/target/release/bundle/nsis/*setup.exe"
          $firma = Get-AuthenticodeSignature $inst.FullName
          "estado: $($firma.Status)"
          if ($env:ECG_SIGN_THUMBPRINT -and $firma.Status -ne "Valid") {
            throw "hay certificado configurado pero el instalador no quedó firmado"
          }
        env:
          ECG_SIGN_THUMBPRINT: ${{ secrets.ECG_SIGN_THUMBPRINT }}

      # El hash se calcula una sola vez, sobre el fichero que se va a publicar,
      # y viaja al cuerpo de la release. Publicar el instalador sin decir cual
      # es su huella deja a quien lo descarga sin forma de comprobar que le ha
      # llegado entero y sin tocar.
      - name: Huella del instalador
        id: huella
        shell: pwsh
        run: |
          $inst = Get-Item "apps/desktop/src-tauri/target/release/bundle/nsis/*setup.exe"
          $sha = (Get-FileHash $inst.FullName -Algorithm SHA256).Hash.ToLower()
          "nombre=$($inst.Name)" >> $env:GITHUB_OUTPUT
          "sha256=$sha"         >> $env:GITHUB_OUTPUT
          "$sha  $($inst.Name)" | Out-File -Encoding ascii "$($inst.DirectoryName)/SHA256SUMS.txt"
          "$($inst.Name)"
          "sha256: $sha"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instalador-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*setup.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt

      # Firma criptografica de la relacion «este binario salio de este commit,
      # en este workflow». No sustituye a la firma Authenticode --no silencia a
      # SmartScreen-- pero es lo que permite verificar la procedencia sin
      # confiar en nadie:
      #
      #     gh attestation verify "Simulador ECG_x.y.z_x64-setup.exe" --repo <owner>/<repo>
      - name: Attestation de procedencia
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: apps/desktop/src-tauri/target/release/bundle/nsis/*setup.exe

      - name: Publicar la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*setup.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          draft: true
          body: |
            Simulador de ECG — ${{ github.ref_name }}

            Herramienta docente. No está destinada al diagnóstico ni al
            tratamiento de pacientes.

            ## Cómo comprobar que el instalador es el que se publicó aquí

            Huella SHA-256 de `${{ steps.huella.outputs.nombre }}`:

            ```
            ${{ steps.huella.outputs.sha256 }}
            ```

            En PowerShell, sobre el fichero descargado:

            ```powershell
            Get-FileHash ".\${{ steps.huella.outputs.nombre }}" -Algorithm SHA256
            ```

            Y la procedencia —que este binario salió de este repositorio y de
            este commit, compilado por este workflow— con la CLI de GitHub:

            ```powershell
            gh attestation verify ".\${{ steps.huella.outputs.nombre }}" --repo ${{ github.repository }}
            ```

            Instrucciones completas, y qué hace el instalador en la máquina, en
            [docs/instalacion.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/instalacion.md).
