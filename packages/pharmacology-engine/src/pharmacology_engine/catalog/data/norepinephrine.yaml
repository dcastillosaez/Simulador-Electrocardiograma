id: norepinephrine
name: Noradrenalina
category: sympathomimetic
routes: [IV, IO]
dose_unit: mg
reference_dose: 0.1
max_cumulative_dose: 1
onset_s: 20
peak_s: 90
duration_s: 300
half_life_s: 60
effects:
  heart_rate_delta_bpm: {slope: -5}
  blood_pressure_delta_mmhg: {slope: 40}
  contractility: {multiplier: 1.30}
  stroke_volume: {multiplier: 1.10}
  automaticity: {multiplier: 1.15}
  oxygen_consumption: {multiplier: 1.25}
clinical_note: >
  Predominio alfa. Sube la presión sin taquicardizar, y la bradicardia
  refleja que produce es el detalle que la distingue de la adrenalina en
  el monitor.
references:
  - "SSC 2021 — Surviving Sepsis Campaign"
