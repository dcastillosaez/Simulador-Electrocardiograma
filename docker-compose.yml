services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecg
      POSTGRES_PASSWORD: ecg
      POSTGRES_DB: ecg_simulator
    ports:
      - "5432:5432"
    volumes:
      - ecg_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecg"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  ecg_pgdata:
