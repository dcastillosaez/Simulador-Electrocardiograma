services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecg
      POSTGRES_PASSWORD: ecg
      POSTGRES_DB: ecg_simulator
    ports:
      # Solo en la interfaz local. Sin el `127.0.0.1`, Docker publica el puerto
      # en TODAS las interfaces: un portatil conectado a la wifi del centro
      # ofrece esta base de datos a la red entera, con la contrasena que esta
      # escrita tres lineas mas arriba y en el repositorio.
      - "127.0.0.1:5432:5432"
    volumes:
      - ecg_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecg"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  ecg_pgdata:
